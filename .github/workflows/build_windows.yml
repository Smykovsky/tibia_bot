name: Build Windows Single Executable

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install vcpkg dependencies (nlohmann-json, lua)
        run: |
          vcpkg install nlohmann-json:x64-windows lua:x64-windows

      - name: Configure and Build C++ Engine
        run: |
          if (Test-Path "engine/build") { Remove-Item -Recurse -Force "engine/build" }
          cmake -B engine/build -S engine `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build engine/build --config Release --parallel

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials pyinstaller

      - name: Prepare Runtime Dependencies for Bundling
        run: |
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll") {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" -Destination "engine\build\Release\" -Force -ErrorAction SilentlyContinue
          }
          $vcRedist = (Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue | Select-Object -First 1)
          if ($vcRedist -and (Test-Path "$($vcRedist.FullName)\*.dll")) {
            Copy-Item "$($vcRedist.FullName)\*.dll" -Destination "engine\build\Release\" -Force -ErrorAction SilentlyContinue
          }

      - name: Bundle Standalone Executable via PyInstaller
        run: |
          pyinstaller TibiaBot.spec --clean --noconfirm

      - name: Copy Configs, Scripts, Engine and DLLs to Distribution Directory
        run: |
          Copy-Item -Path "configs" -Destination "dist\configs" -Recurse -Force
          Copy-Item -Path "scripts" -Destination "dist\scripts" -Recurse -Force
          if (Test-Path "engine\build\Release\tibia_engine.exe") {
            Copy-Item "engine\build\Release\tibia_engine.exe" -Destination "dist\tibia_engine.exe" -Force
          }
          if (Test-Path "engine\build\Release\*.dll") {
            Copy-Item "engine\build\Release\*.dll" -Destination "dist\" -Force -ErrorAction SilentlyContinue
          }

      - name: Upload TibiaBot Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TibiaBot-Windows-x64
          path: dist/

      - name: Create Zip Archive for Public Release
        run: |
          Compress-Archive -Path "dist/*" -DestinationPath "TibiaBot-v1.0.0-Windows.zip" -Force

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/impl' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-beta
          name: "TibiaBot v1.0.0 (Windows Standalone)"
          body: |
            ## TibiaBot - Shrouded Edition (Universal Bot)
            - Samodzielny plik wykonywalny **TibiaBot.exe**
            - Wbudowany C++20 Engine + PySide6 Qt GUI
            - Gotowy do gry na **Dragon Ball Victory (dbvStart.exe)** oraz Tibia.exe
            
            ### Jak uruchomić:
            1. Pobierz `TibiaBot-v1.0.0-Windows.zip` poniżej.
            2. Wypakuj całe archiwum zip do folderu.
            3. Uruchom `TibiaBot.exe`!
          files: |
            TibiaBot-v1.0.0-Windows.zip
            dist/TibiaBot.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
